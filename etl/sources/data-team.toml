# The data team's spreadsheet, checked before its rows are copied into the
# main sheet. Used by: etl/cleanup.sh --source data-team
#                      etl/validate.sh --source data-team
#
# Only the three tabs below are read. Every other sheet (prospects, alias,
# ticker, ...) is skipped, and so are the checks that need them.
#
# How to edit:
#   [<our sheet>]          tab = the data team's tab name
#   [<our sheet>.columns]  our column = "their header"
#                          Matching ignores case, extra spaces and line breaks,
#                          so "Source Link\n(HQ Offering)" is written as
#                          "Source Link (HQ Offering)".
#                          "" means their sheet has no such column (it is
#                          filled or calculated in our sheet), so it is not
#                          checked.
#   ignore                 their columns we do not copy. Any header that is
#                          neither mapped nor listed here is reported, so a
#                          new or renamed column is never missed silently.
#   [<our sheet>.values.<our column>]
#                          "their value" = "our value", for a column where
#                          the two sheets use different words. Validate
#                          checks the translated value; any other value is
#                          checked as it is. Cleanup never writes our words
#                          into their sheet.
#
# Headers with a year in them ("HQ Forbes 2026", "( June 2026 )") change
# when the data team rolls them over. Validate then reports the old header
# as missing; update it here.

title = "Data team sheet"
# The spreadsheet ID lives in etl/.env, like the main sheet's.
spreadsheet_env = "DATA_TEAM_SPREADSHEET_ID"

# -- accounts ------------------------------------------------------------------
[accounts]
tab = "BR"
# The ranges and First Center are calculated by formulas in our sheet, so their values are never copied.
ignore = ["Center Type Priority", "HQ Revenue Range", "HQ Employee Range", "First Center"]

